# Routine updates preserve the supported compatibility lines.
# Major upgrades are deliberate; security updates retain their separate policy.

version: 2

updates:
  - package-ecosystem: pip
    directories:
      - /
      - /client
      - /examples/llm-classify
    schedule:
      interval: weekly
      day: monday
    cooldown:
      # check_dependency_age.py refuses any third-party upload younger than
      # seven days; without a matching cooldown Dependabot opens a bump that
      # fails its own quarantine gate.
      default-days: 7
    groups:
      pip-production:
        dependency-type: production
        update-types: [minor, patch]
      pip-development:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      - dependency-name: "ezclassify-rest-*"
    labels: [dependencies]
    allow:
      - dependency-name: "*"
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
    open-pull-requests-limit: 0

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
        update-types: [minor, patch]
    labels: [dependencies, ci]
    allow:
      - dependency-name: "*"
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
    open-pull-requests-limit: 0
